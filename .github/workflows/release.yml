name: Release

# Fires on a version tag, e.g. `git tag v2.0-sdl2 && git push origin v2.0-sdl2`.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            # Multi-config generator: the binary lands in a per-config subdir.
            exe: build/Release/cardgame_sdl2.exe
            assets_dir: build/Release
          - os: macos-latest
            name: macos
            exe: build/cardgame_sdl2
            assets_dir: build
          # Pinned, not ubuntu-latest. A binary needs at least the glibc it
          # was built against, so the build host sets the minimum distro it
          # will run on. 24.04 (glibc 2.39) would refuse to start on Ubuntu
          # 22.04, Debian 12 or Mint 21 with "GLIBC_2.39 not found".
          # 22.04 gives glibc 2.35 and covers those.
          - os: ubuntu-22.04
            name: linux
            exe: build/cardgame_sdl2
            assets_dir: build

    steps:
      - uses: actions/checkout@v4

      # SDL2 is built from source via FetchContent, so Linux needs the X11,
      # OpenGL and audio development headers present or the SDL configure step
      # silently produces a build with no video/audio backend.
      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libasound2-dev libpulse-dev

      - name: Configure
        # CMAKE_POLICY_VERSION_MINIMUM must be an ENVIRONMENT variable, not a
        # -D cache flag: passed as -D the value gets truncated to "3" and CMake
        # rejects it. Several of SDL's vendored dependencies still declare a
        # cmake_minimum_required below what modern CMake accepts without it.
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cmake --build build --config Release --parallel

      # CMakeLists already copies assets/, config/ and sounds/ next to the
      # binary as a post-build step, so packaging just collects that folder.
      - name: Package
        shell: bash
        run: |
          set -eu
          staging="RoguelikeCardgame-${{ matrix.name }}"
          mkdir -p "$staging"
          cp "${{ matrix.exe }}" "$staging/"
          cp -r "${{ matrix.assets_dir }}/assets" "$staging/assets"
          cp -r "${{ matrix.assets_dir }}/config" "$staging/config"
          cp -r "${{ matrix.assets_dir }}/sounds" "$staging/sounds"
          # DejaVu Sans Mono is redistributable but its license must ship with it.
          test -f "$staging/assets/DejaVuSansMono-LICENSE.txt"
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a -tzip "$staging.zip" "$staging"
          elif [ "${{ matrix.name }}" = "macos" ]; then
            # Wrap it in a real .app. Assets sit beside the binary in
            # Contents/MacOS because the game resolves them from the executable's
            # own directory - putting them in Resources/ would need a code change.
            app="$staging/Roguelike Cardgame.app"
            mkdir -p "$app/Contents/MacOS"
            mv "$staging/cardgame_sdl2" "$app/Contents/MacOS/"
            mv "$staging/assets" "$staging/config" "$staging/sounds" "$app/Contents/MacOS/"
            chmod +x "$app/Contents/MacOS/cardgame_sdl2"

            # Written with grouped echoes rather than a heredoc: a heredoc
            # terminator has to sit at column 0, which would close the YAML
            # block scalar this whole script lives in and break the workflow.
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              echo '<plist version="1.0">'
              echo '<dict>'
              echo '  <key>CFBundleName</key><string>Roguelike Cardgame</string>'
              echo '  <key>CFBundleDisplayName</key><string>Roguelike Cardgame</string>'
              echo '  <key>CFBundleExecutable</key><string>cardgame_sdl2</string>'
              echo '  <key>CFBundleIdentifier</key><string>io.github.shayanmh2.roguelikecardgame</string>'
              echo '  <key>CFBundlePackageType</key><string>APPL</string>'
              echo '  <key>CFBundleShortVersionString</key><string>0.9.3</string>'
              echo '  <key>CFBundleVersion</key><string>0.9.3</string>'
              echo '  <key>LSMinimumSystemVersion</key><string>10.13</string>'
              echo '  <key>NSHighResolutionCapable</key><true/>'
              echo '</dict>'
              echo '</plist>'
            } > "$app/Contents/Info.plist"

            # Ad-hoc signature. This does not satisfy notarisation, but an
            # arm64 binary with no signature at all is killed outright by the
            # kernel, and re-signing after we rearranged the bundle keeps it
            # from being reported as damaged.
            codesign --force --deep --sign - "$app" || echo "codesign failed (non-fatal)"

            cp res/MACOS-README.txt "$staging/" 2>/dev/null || true
            # tar, not zip: it preserves the executable bit and the bundle layout.
            tar czf "$staging.tar.gz" "$staging"
          else
            chmod +x "$staging/cardgame_sdl2"
            tar czf "$staging.tar.gz" "$staging"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RoguelikeCardgame-${{ matrix.name }}.zip
            RoguelikeCardgame-${{ matrix.name }}.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: false
